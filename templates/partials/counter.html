<a href="{% url 'ui:monitors' %}?status={{ status }}" class="card group block p-4 transition hover:border-line-strong">
  <div class="flex items-center gap-2.5">
    <span class="icon-chip text-{{ tone }}">{% icon icon_name "size-4" %}</span>
    <span class="text-[13px] font-medium text-ink-2">{{ label }}</span>
    <span class="ml-auto opacity-0 transition group-hover:opacity-100">{% icon "arrow-up-right" "size-3.5 text-muted" %}</span>
  </div>
  <div class="mt-4 flex items-end justify-between gap-2">
    <div class="stat-num {% if value and bad %}text-{{ tone }}{% endif %}">{{ value }}</div>
  </div>
  <div class="mt-3 flex items-center justify-between text-[11px] text-muted">
    <span>Monitors · now</span>
    {% if trend %}<span class="trend {% if bad %}trend-down{% else %}trend-up{% endif %}">{% if bad %}{% icon "trending-up" "size-3" %}{% else %}{% icon "trending-up" "size-3" %}{% endif %}{{ trend }}</span>{% endif %}
  </div>
</a>
