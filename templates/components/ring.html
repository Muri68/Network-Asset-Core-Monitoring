<div class="flex flex-col items-center gap-2">
  <div class="relative" style="width: {{ size }}px; height: {{ size }}px">
    <svg viewBox="0 0 84 84" class="size-full -rotate-90">
      <circle cx="42" cy="42" r="{{ r }}" fill="none" stroke="var(--surface-3)" stroke-width="7"/>
      <circle cx="42" cy="42" r="{{ r }}" fill="none" stroke="var(--{{ tone }})" stroke-width="7" stroke-linecap="round"
              stroke-dasharray="{{ dash }} {{ circ }}" class="glow-{{ tone }}"/>
      <circle cx="42" cy="42" r="26" fill="none" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 3"/>
    </svg>
    <div class="absolute inset-0 grid place-items-center text-center leading-none">
      <div><div class="text-lg font-semibold tabular-nums">{{ value }}</div><div class="mt-1 text-[9px] text-muted">of {{ total }}</div></div>
    </div>
  </div>
  <div class="text-xs font-medium text-ink-2">{{ label }}</div>
</div>
