<div class="{{ cls }}">
  <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required and not hide_required %} *{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<p class="hint">{{ field.help_text|safe }}</p>{% endif %}
  {% for e in field.errors %}<p class="field-error">{{ e }}</p>{% endfor %}
</div>
