{# A password input with show/hide and a generator (browser crypto, 20 characters). #}
<div x-data="{ show: false, gen() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789!@#%^*-_=+'; const v = new Uint32Array(20); crypto.getRandomValues(v); $refs.pw.value = Array.from(v, x => a[x % a.length]).join(''); show = true } }" class="{{ cls }}">
  <label class="field-label" for="{{ field.id_for_label }}">{{ field.label }} *</label>
  <div class="relative">
    <input name="{{ field.html_name }}" id="{{ field.id_for_label }}" x-ref="pw" :type="show ? 'text' : 'password'" class="input mono pr-20" autocomplete="new-password" aria-invalid="{% if field.errors %}true{% else %}false{% endif %}">
    <div class="absolute top-1.5 right-1.5 flex gap-1">
      <button type="button" class="btn btn-ghost btn-icon btn-sm" @click="show = !show" :aria-label="show ? 'Hide' : 'Show'">{% icon "eye" "size-3.5" %}</button>
      <button type="button" class="btn btn-ghost btn-icon btn-sm" @click="gen()" aria-label="Generate a strong password" title="Generate a strong password">{% icon "refresh-cw" "size-3.5" %}</button>
    </div>
  </div>
  <p class="hint">Encrypted before it's stored. The {% icon "refresh-cw" "size-3 inline" %} button generates a strong one.</p>
  {% for e in field.errors %}<p class="field-error">{{ e }}</p>{% endfor %}
</div>
