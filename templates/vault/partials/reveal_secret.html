<div x-data="{ left: 30, show: true, t: null }" x-init="t = setInterval(() => { if (--left <= 0) { clearInterval(t); show = false } }, 1000)" class="space-y-4">
  <template x-if="show">
    <div class="space-y-4">
      <div class="flex items-center gap-2 text-[13px] text-up">{% icon "circle-check" "size-4" %} Code accepted — this reveal was logged.</div>
      <div class="flex items-center gap-2 rounded-xl border border-accent bg-up-soft p-3">
        <code class="mono flex-1 text-base font-semibold break-all text-ink">{{ c.fake_secret }}</code>
        <button type="button" class="btn btn-sm" @click="navigator.clipboard && navigator.clipboard.writeText('{{ c.fake_secret|escapejs }}'); $store.toast.show('Copied — copy event logged. Clipboard clears in 30s.')">{% icon "copy" "size-3.5" %} Copy</button>
      </div>
      <div>
        <div class="meter meter-up h-1.5"><span class="transition-all duration-1000 ease-linear" :style="`width: ${left / 30 * 100}%`"></span></div>
        <p class="hint">Hides automatically in <span x-text="left"></span>s.</p>
      </div>
      <button type="button" class="btn w-full" @click="show = false; clearInterval(t)">{% icon "eye-off" %} Hide now</button>
    </div>
  </template>
  <template x-if="!show">
    <div class="py-6 text-center">
      <div class="icon-chip mx-auto size-11 rounded-xl">{% icon "eye-off" "size-5" %}</div>
      <p class="mt-3 text-[13px] font-medium">Password hidden again</p>
      <p class="mt-1 text-xs text-muted">Close this window and reveal again if you need it — that needs your code again.</p>
    </div>
  </template>
</div>
