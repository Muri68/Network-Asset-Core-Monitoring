<div x-data="{ open: false, remote: 'device' }" @open-connect.window="open = true" x-show="open" x-cloak
     class="fixed inset-0 z-[60] grid place-items-center bg-black/60 p-4 backdrop-blur-sm" x-transition.opacity>
  <form data-prototype="Connection saved" @prototype-submitted="open = false" @click.outside="open = false" class="card max-h-[90vh] w-full max-w-2xl overflow-y-auto p-0">
    <div class="card-head border-b border-line pb-4">
      <div><h2 class="card-title">Add connection</h2><p class="mt-0.5 text-xs text-muted">One record — it shows on both devices automatically.</p></div>
      <button type="button" class="btn btn-ghost btn-icon btn-sm" @click="open = false">{% icon "x" %}</button>
    </div>
    <div class="grid gap-5 p-5 md:grid-cols-[1fr_auto_1fr]">
      <div class="space-y-3">
        <div class="text-xs font-semibold text-muted uppercase">Side A</div>
        <div><label class="field-label">Device</label>
          <select class="input">{% for x in devices %}<option {% if this_device and x.id == this_device.id %}selected{% endif %}>{{ x.name }}</option>{% endfor %}</select></div>
        <div><label class="field-label">Port</label><input class="input mono" placeholder="port1"></div>
      </div>
      <div class="hidden place-items-center text-faint md:grid">{% icon "arrow-left-right" "size-5" %}</div>
      <div class="space-y-3">
        <div class="flex items-center justify-between"><span class="text-xs font-semibold text-muted uppercase">Side B</span>
          <div class="flex gap-1"><button type="button" class="chip h-6 px-2" :class="remote==='device' && 'chip-active'" @click="remote='device'">Device</button>
            <button type="button" class="chip h-6 px-2" :class="remote==='external' && 'chip-active'" @click="remote='external'">External</button></div></div>
        <template x-if="remote === 'device'"><div class="space-y-3">
          <div><label class="field-label">Device</label><select class="input">{% for x in devices %}<option>{{ x.name }}</option>{% endfor %}</select></div>
          <div><label class="field-label">Port</label><input class="input mono" placeholder="Gi1/0/10"></div></div></template>
        <template x-if="remote === 'external'"><div><label class="field-label">External endpoint</label>
          <input class="input" placeholder="e.g. ISP fibre handoff, Wall jack B-12"></div></template>
      </div>
      <div class="grid gap-4 border-t border-line pt-5 md:col-span-3 md:grid-cols-2">
        <div class="md:col-span-2"><label class="field-label">Function</label><input class="input" placeholder="e.g. Internet + VLAN trunk"></div>
        <div><label class="field-label">Mode</label><select class="input"><option>Trunk</option><option>Access</option><option>Routed</option></select></div>
        <div><label class="field-label">VLANs</label><input class="input mono" placeholder="10,20,30"></div>
        <div><label class="field-label">Cable label</label><input class="input mono" placeholder="C-010"></div>
        <div><label class="field-label">Cable type</label><select class="input"><option>Cat6A</option><option>Cat6</option><option>Fibre SM</option><option>Fibre MM</option><option>DAC</option></select></div>
        <div class="md:col-span-2"><label class="field-label">Remark</label><input class="input" placeholder="Optional"></div>
      </div>
    </div>
    <div class="flex items-center justify-between gap-2 border-t border-line px-5 py-4">
      <p class="text-xs text-muted">A port can only have one connection.</p>
      <div class="flex gap-2"><button type="button" class="btn" @click="open = false">Cancel</button><button class="btn btn-primary">Save connection</button></div>
    </div>
  </form>
</div>
