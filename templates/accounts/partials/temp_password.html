<div x-data="{ open: true, copied: false }" x-show="open" class="fixed inset-0 z-[60] grid place-items-center bg-black/60 p-4 backdrop-blur-sm">
  <div class="card w-full max-w-md p-0">
    <div class="card-head border-b border-line pb-4"><h2 class="card-title">{% if t.new %}User created{% else %}Password reset{% endif %}</h2></div>
    <div class="space-y-4 p-5 text-[13px]">
      <p class="text-ink-2">Temporary password for <b class="text-ink">{{ t.user }}</b> (<span class="mono">{{ t.username }}</span>):</p>
      <div class="flex items-center gap-2 rounded-xl border border-accent bg-up-soft p-3">
        <code class="mono flex-1 text-base font-semibold tracking-wide">{{ t.password }}</code>
        <button type="button" class="btn btn-sm" @click="navigator.clipboard && navigator.clipboard.writeText('{{ t.password|escapejs }}'); copied = true">{% icon "copy" "size-3.5" %} <span x-text="copied ? 'Copied' : 'Copy'">Copy</span></button>
      </div>
      <p class="flex items-start gap-2 text-xs text-warn">{% icon "triangle-alert" "size-3.5 mt-0.5 shrink-0" %} This is the only time it's shown. They'll choose their own password at first sign-in.</p>
    </div>
    <div class="flex justify-end border-t border-line px-5 py-4"><button class="btn btn-primary" @click="open = false">Done</button></div>
  </div>
</div>
