{% extends "auth/base_auth.html" %}
{% block title %}Verify{% endblock %}
{% block content %}
<span class="icon-chip size-12 rounded-xl text-up">{% icon "smartphone" "size-5" %}</span>
<h1 class="mt-5 text-2xl font-semibold tracking-tight">Two-factor check</h1>
<p class="mt-1 text-[13px] text-muted">Enter the 6-digit code from your authenticator app.</p>
<form action="{% url 'ui:dashboard' %}" method="get" class="mt-8 space-y-4"
      x-data="{ d: ['', '', '', '', '', ''] }">
  <div class="flex justify-between gap-2">
    <template x-for="(v, i) in d" :key="i">
      <input x-model="d[i]" maxlength="1" inputmode="numeric" class="input mono h-12 w-12 text-center text-lg"
             @input="if ($event.target.value && $event.target.nextElementSibling) $event.target.nextElementSibling.focus()">
    </template>
  </div>
  <button class="btn btn-primary h-11 w-full">Verify & sign in</button>
</form>
<div class="mt-6 flex justify-between text-xs text-muted">
  <a href="#" class="hover:text-ink">Use a backup code</a>
  <a href="{% url 'ui:login' %}" class="hover:text-ink">Back</a>
</div>
{% endblock %}
