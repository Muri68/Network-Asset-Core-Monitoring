{% extends "auth/base_auth.html" %}
{% block content %}
<h1 class="text-2xl font-semibold tracking-tight">Sign in</h1>
<p class="mt-1 text-[13px] text-muted">Use the account your administrator created for you.</p>
<form method="post" class="mt-8 space-y-4" novalidate>
  {% csrf_token %}
  {% include "components/form_errors.html" %}
  <div>
    <label class="field-label" for="id_username">Username or email</label>
    <input id="id_username" name="username" value="{{ form.username.value|default:'' }}" class="input h-11" autocomplete="username" autocapitalize="none" autofocus required>
  </div>
  <div x-data="{ show: false }">
    <label class="field-label" for="id_password">Password</label>
    <div class="relative">
      <input id="id_password" name="password" :type="show ? 'text' : 'password'" type="password" class="input h-11 pr-10" autocomplete="current-password" required>
      <button type="button" class="absolute top-3 right-3 text-muted" @click="show = !show" aria-label="Show password">{% icon "eye" %}</button>
    </div>
  </div>
  <button class="btn btn-primary h-11 w-full">Continue</button>
</form>
<p class="mt-6 text-center text-xs text-muted">Forgot your password? Ask an Admin to reset it.</p>
{% endblock %}
