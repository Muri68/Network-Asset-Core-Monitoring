# NetCore (installed by deploy/server/setup.sh; __ADDRESS__ is replaced with the server's address).
limit_req_zone $binary_remote_addr zone=netcore_login:10m rate=10r/m;

upstream netcore_web {
    server unix:/run/netcore/web.sock fail_timeout=0;
}

server {
    listen 80 default_server;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name __ADDRESS__ _;
    server_tokens off;

    ssl_certificate     /etc/netcore/tls/netcore.crt;
    ssl_certificate_key /etc/netcore/tls/netcore.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:netcore_tls:10m;

    client_max_body_size 6m;  # imports are capped at 5 MB

    location /static/ {
        alias /var/lib/netcore/static/;
        add_header Cache-Control "no-cache";  # revalidate, so a deploy's new CSS shows at once
        access_log off;
    }

    location /login/ {
        limit_req zone=netcore_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://netcore_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://netcore_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
}
