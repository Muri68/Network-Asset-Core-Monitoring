[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["**/migrations/*", "apps/ui/fake_data.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
